[package]
name = "gitlab-mr-lsp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gitlab-mr-lsp"
path = "src/main.rs"

[dependencies]
# LSP framework
tower-lsp = "0.20"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for GitLab API
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# JSON serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging (tower-lsp uses tracing internally)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config file parsing
toml = "0.8"

# Async trait support (required for tower-lsp LanguageServer impl)
async-trait = "0.1"

# URL building
url = "2"

# anyhow for ergonomic error handling
anyhow = "1"

# Glob pattern matching for ignore_patterns
glob = "0.3"

# tempfile for $EDITOR flow
tempfile = "3"

[dev-dependencies]
tokio-test = "0.4"
